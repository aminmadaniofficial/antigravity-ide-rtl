name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish package
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package version: $CURRENT_VERSION"
          
          # Check if this version is already published on npm
          PUBLISHED_VERSIONS=$(npm view antigravity-ide-rtl versions --json 2>/dev/null || echo "[]")
          if echo "$PUBLISHED_VERSIONS" | grep -q "\"$CURRENT_VERSION\""; then
            echo "✔ Version $CURRENT_VERSION is already published to NPM. Skipping publish to avoid 409 conflict."
          else
            echo "Publishing version $CURRENT_VERSION to NPM..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
